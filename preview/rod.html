<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Rod &amp; lures preview</title>
<style>
html,body{margin:0;height:100%;background:#8fb3d9;overflow:hidden;font:12px/1.35 system-ui,Segoe UI,Arial,sans-serif}
canvas{display:block}
#ui{position:absolute;top:8px;left:8px;width:250px;background:rgba(18,24,30,.78);color:#e8eef2;padding:10px 12px;border-radius:8px;user-select:none}
#ui h1{font-size:13px;margin:0 0 6px}
#ui label{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:3px 0}
#ui input[type=range]{width:120px}
#ui .row{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
#ui button{background:#2f4a5a;color:#fff;border:0;border-radius:4px;padding:3px 7px;cursor:pointer;font-size:11px}
#ui button.on{background:#c0392b}
#stats{position:absolute;right:8px;top:8px;background:rgba(18,24,30,.7);color:#cfe;padding:6px 9px;border-radius:6px;white-space:pre;font:11px monospace}
#help{color:#9ab;font-size:11px;margin-top:6px}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <h1>Alpenfisch – rod, reel &amp; lures</h1>
  <label>Bend amount <input id="bend" type="range" min="0" max="1.3" step="0.01" value="0.35"><span id="bendV"></span></label>
  <label>Target azimuth <input id="az" type="range" min="-120" max="120" step="1" value="10"></label>
  <label>Target elevation <input id="el" type="range" min="-85" max="40" step="1" value="-25"></label>
  <label>Target distance <input id="dist" type="range" min="1.5" max="20" step="0.1" value="7"></label>
  <label><span><input id="fight" type="checkbox"> auto fish fight</span></label>
  <label>Crank (rev/s) <input id="crank" type="range" min="-1" max="3" step="0.05" value="0.8"><span id="crankV"></span></label>
  <label>Drag <input id="drag" type="range" min="0" max="1" step="0.01" value="0.5"></label>
  <label>Spool fill <input id="spool" type="range" min="0" max="1" step="0.01" value="0.85"></label>
  <label>Lure speed (m/s) <input id="lspeed" type="range" min="0" max="1.5" step="0.01" value="0.6"></label>
  <label>Lure on line <select id="lure"><option>spinner</option><option>spoon</option><option>minnow</option><option>float</option></select></label>
  <div class="row"><button id="bail">Bail: closed (B)</button></div>
  <div class="row" id="cams"></div>
  <div id="help">Keys: B bail · Space fight · arrows move target · 1-9 cameras · drag to orbit</div>
</div>
<div id="stats"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { createRod } from '../src/models/rod.js';
import { createLure, LURE_TYPES, LURE_INFO } from '../src/models/lures.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fb3d9);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;
const sun = new THREE.DirectionalLight(0xfff1dd, 3); sun.position.set(5, 8, 4); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.camera.left = -3; sun.shadow.camera.right = 3; sun.shadow.camera.top = 3; sun.shadow.camera.bottom = -3;
sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.002;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x5a4a30, 0.6));
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.005, 500);
camera.position.set(2.2, 1.6, 2.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.4, 1.0);

// ground + water for context
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x6f8f4e, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const water = new THREE.Mesh(new THREE.PlaneGeometry(60, 30), new THREE.MeshPhysicalMaterial({ color: 0x2fb5b0, roughness: 0.08, metalness: 0, transparent: true, opacity: 0.85 }));
water.rotation.x = -Math.PI / 2; water.position.set(0, 0.02, 18); scene.add(water);

// ---------------- rod
const rod = createRod({ accent: 0x8e1b2b });
rod.object.position.set(0, 1.05, 0);
rod.object.rotation.set(-THREE.MathUtils.degToRad(30), 0, 0);
scene.add(rod.object);
console.log('rod stats', rod.stats);

const target = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 12), new THREE.MeshStandardMaterial({ color: 0xff5533, emissive: 0x551100 }));
scene.add(target);

// ---------------- lures: one on the line + showcase
let lureOnLine = null;
function setLineLure(type) {
  if (lureOnLine) { scene.remove(lureOnLine.object); if (lureOnLine.bait) scene.remove(lureOnLine.bait); }
  lureOnLine = createLure(type);
  scene.add(lureOnLine.object);
  if (lureOnLine.bait) scene.add(lureOnLine.bait);
}
setLineLure('spinner');
// lure board: spinner / spoon / wobbler hang horizontally (nose to -X), float + bait on the right
const show = new THREE.Group(); show.position.set(0.8, 0.9, -0.4); scene.add(show);
const showcase = [];
const SHOW_POS = { spinner: [0, 0.17, 0], spoon: [0, 0.11, 0], minnow: [0, 0.04, 0], float: [0.11, -0.01, 0] };
LURE_TYPES.forEach((t) => {
  const l = createLure(t);
  l.object.position.set(...SHOW_POS[t]);
  if (t !== 'float') l.object.rotation.y = -Math.PI / 2;
  show.add(l.object);
  if (l.bait) { l.bait.position.set(SHOW_POS[t][0] + 0.05, 0.16, 0); show.add(l.bait); }
  showcase.push(l);
});
const board = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.26, 0.01), new THREE.MeshStandardMaterial({ color: 0x6b5238, roughness: 0.85 }));
board.position.set(0.07, 0.09, -0.03); board.receiveShadow = true; show.add(board);
const showCam = (x, y, d) => { show.updateMatrixWorld(true); const a = new THREE.Vector3(x, y, d).applyMatrix4(show.matrixWorld), b = new THREE.Vector3(x, y, 0).applyMatrix4(show.matrixWorld); return { pos: a.toArray(), tgt: b.toArray() }; };
console.log('lures', LURE_INFO);

// ---------------- line
const MAXP = 64;
const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(MAXP * 3), 3));
const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0xd7e36a }));
line.frustumCulled = false; scene.add(line);
const path = [];

// ---------------- UI
const $ = (id) => document.getElementById(id);
let bailOpen = false;
$('bail').onclick = () => { bailOpen = !bailOpen; $('bail').textContent = `Bail: ${bailOpen ? 'OPEN' : 'closed'} (B)`; $('bail').classList.toggle('on', bailOpen); };
$('lure').onchange = (e) => setLineLure(e.target.value);
const cams = {
  overview: () => ({ pos: [2.2, 1.6, 2.4], tgt: [0, 1.4, 1.0] }),
  reel: () => rel([0.16, 0.05, 0.10], [0, -0.075, 0.45]),
  reelRight: () => rel([-0.17, -0.02, 0.06], [0, -0.075, 0.47]),
  reelFront: () => rel([0.05, -0.04, 0.68], [0, -0.07, 0.48]),
  grip: () => rel([0.22, 0.12, 0.15], [0, 0, 0.35]),
  guides: () => rel([0.2, -0.05, 1.0], [0, -0.03, 1.05]),
  tip: () => { const p = rod.tip.getWorldPosition(new THREE.Vector3()); return { pos: [p.x + 0.09, p.y + 0.03, p.z - 0.1], tgt: p.toArray() }; },
  lures: () => showCam(0.07, 0.09, 0.42),
  spinner: () => showCam(0.025, 0.17, 0.11),
  spoon: () => showCam(0.03, 0.11, 0.11),
  minnow: () => showCam(0.04, 0.04, 0.12),
  float: () => showCam(0.14, 0.07, 0.2),
  firstPerson: () => rel([0.20, 0.24, 0.02], [-0.06, 0.02, 1.3]),
};
function rel(p, t) {
  rod.object.updateMatrixWorld(true);
  const a = new THREE.Vector3(...p).applyMatrix4(rod.object.matrixWorld), b = new THREE.Vector3(...t).applyMatrix4(rod.object.matrixWorld);
  return { pos: a.toArray(), tgt: b.toArray() };
}
function setCam(name) { const c = cams[name](); camera.position.set(...c.pos); controls.target.set(...c.tgt); controls.update(); }
Object.keys(cams).forEach((k, i) => { const b = document.createElement('button'); b.textContent = `${i + 1} ${k}`; b.onclick = () => setCam(k); $('cams').appendChild(b); });
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'b' || e.key === 'B') $('bail').click();
  if (e.key === ' ') { $('fight').checked = !$('fight').checked; e.preventDefault(); }
  const n = parseInt(e.key, 10); if (n >= 1 && n <= 9) setCam(Object.keys(cams)[n - 1]);
  if (e.key === 'ArrowLeft') $('az').value = +$('az').value + 3;
  if (e.key === 'ArrowRight') $('az').value = +$('az').value - 3;
  if (e.key === 'ArrowUp') $('el').value = +$('el').value + 3;
  if (e.key === 'ArrowDown') $('el').value = +$('el').value - 3;
});
window.__rod = rod; window.__setCam = setCam; window.__THREE = THREE; window.__camera = camera; window.__controls = controls;

// ---------------- loop
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
let time = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05); time += dt;
  // target
  const az = THREE.MathUtils.degToRad(+$('az').value), el = THREE.MathUtils.degToRad(+$('el').value), d = +$('dist').value;
  const base = new THREE.Vector3(0, 1.05, 0).add(new THREE.Vector3(0, Math.sin(Math.PI / 6), Math.cos(Math.PI / 6)).multiplyScalar(2.6));
  let amt = +$('bend').value;
  let wob = 0;
  if ($('fight').checked) { amt = 0.75 + 0.45 * Math.sin(time * 1.3) * Math.sin(time * 0.37) + 0.12 * Math.sin(time * 9); wob = 0.25 * Math.sin(time * 0.8); }
  target.position.set(base.x + d * Math.cos(el) * Math.sin(az + wob), Math.max(0.03, base.y + d * Math.sin(el)), base.z + d * Math.cos(el) * Math.cos(az + wob));
  $('bendV').textContent = amt.toFixed(2);
  $('crankV').textContent = (+$('crank').value).toFixed(2);
  rod.setBend(amt, target.position);
  rod.setReel({ crank: +$('crank').value, bailOpen, drag: +$('drag').value });
  rod.setSpoolLine(+$('spool').value);
  rod.update(dt);
  // line: spool -> guides -> tip, then a sagging free segment to the lure at the target
  rod.getLinePath(path);
  const pos = lineGeo.attributes.position.array;
  let n = 0;
  for (const p of path) { pos[n * 3] = p.x; pos[n * 3 + 1] = p.y; pos[n * 3 + 2] = p.z; n++; }
  const tipP = path[path.length - 1], end = target.position;
  const FREE = 30, sag = Math.max(0, 0.6 - amt * 0.55) * tipP.distanceTo(end) * 0.08;
  for (let i = 1; i <= FREE; i++) {
    const t = i / FREE; tmp.lerpVectors(tipP, end, t); tmp.y -= sag * 4 * t * (1 - t);
    pos[n * 3] = tmp.x; pos[n * 3 + 1] = tmp.y; pos[n * 3 + 2] = tmp.z; n++;
  }
  lineGeo.setDrawRange(0, n);
  lineGeo.attributes.position.needsUpdate = true;
  // lure on the line
  const ls = +$('lspeed').value;
  if (lureOnLine.bait) {
    lureOnLine.object.position.copy(end).add(new THREE.Vector3(0, -0.04, 0));
    lureOnLine.object.rotation.set(0, 0, 0);
    lureOnLine.bait.position.copy(lureOnLine.object.position);
  } else {
    lureOnLine.object.position.copy(end);
    tmp.set(pos[(n - 2) * 3], pos[(n - 2) * 3 + 1], pos[(n - 2) * 3 + 2]);
    lureOnLine.object.lookAt(tmp);
  }
  lureOnLine.setMotion(ls); lureOnLine.update(dt);
  for (const l of showcase) { l.setMotion(ls); l.update(dt); }
  controls.update();
  renderer.render(scene, camera);
  if ((time * 4 | 0) !== ((time - dt) * 4 | 0)) {
    $('stats').textContent = `draw calls ${renderer.info.render.calls}\ntris ${renderer.info.render.triangles}\nrod tris ${rod.stats.triangles.total}\n` +
      Object.entries(rod.stats.triangles).map(([k, v]) => `  ${k} ${v}`).join('\n');
  }
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
