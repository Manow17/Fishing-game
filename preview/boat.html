<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Boat preview</title>
<style>
html,body{margin:0;height:100%;background:#8fb3d9;overflow:hidden;font:12px/1.4 system-ui,sans-serif}
canvas{display:block}
#ui{position:fixed;left:10px;top:10px;background:rgba(15,25,30,.74);color:#e8f1f2;padding:10px 12px;border-radius:8px;min-width:240px;max-height:calc(100vh - 40px);overflow:auto}
#ui label{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:4px 0}
#ui input[type=range]{width:130px}
#ui select{width:130px}
#ui .views button{margin:2px 2px 0 0;font-size:11px}
#ui .types button{margin:2px 2px 0 0;font-size:11px}
#ui .types button.on{background:#3fbfb5;color:#062}
#stats{margin-top:6px;color:#9fd6cf;white-space:pre}
#shot{position:fixed;inset:0;width:100%;height:100%;display:none;z-index:10;object-fit:cover}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<img id="shot" alt="">
<div id="ui">
  <b>Boat preview</b>
  <div class="types">Type: <button data-t="weidling">Weidling</button><button data-t="runabout">Runabout</button><button data-t="sportfisher">Sportfisher</button></div>
  <label>Size <input id="size" type="range" min="0.7" max="1.6" step="0.01" value="1"><span id="sizev">1.00×</span></label>
  <label>Paint <span><input id="paintOn" type="checkbox"> <input id="paint" type="color" value="#2b5f8a"></span></label>
  <label>Accent <input id="accent" type="color" value="#e8452c"></label>
  <label>Throttle (W/S) <input id="thr" type="range" min="-1" max="1" step="0.01" value="0"></label>
  <label>Steer (A/D) <input id="str" type="range" min="-1" max="1" step="0.01" value="0"></label>
  <label>Anchor (Q) <input id="anc" type="checkbox"></label>
  <label>Bob on water <input id="bob" type="checkbox"></label>
  <label>Anglers <input id="ang" type="checkbox" checked></label>
  <label>Fisher look yaw <input id="lyaw" type="range" min="-3" max="3" step="0.01" value="0"></label>
  <label>Chase camera (C) <input id="chase" type="checkbox"></label>
  <div class="views">Views: <button data-v="overview">1 overview</button><button data-v="side">2 side</button><button data-v="bow">3 bow</button><button data-v="stern">4 stern</button><button data-v="interior">5 interior</button><button data-v="top">6 top</button><button data-v="anglers">7 anglers</button><button data-v="under">8 under</button><button data-v="helm">9 helm</button></div>
  <div id="stats"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { createBoat, createLandingNet } from '../src/models/boat.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fb3d9);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;
const sun = new THREE.DirectionalLight(0xfff1dd, 3); sun.position.set(5, 8, 4); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 0.5, far: 40 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun); scene.add(sun.target);
scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x5a4a30, 0.6));
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 500);
camera.position.set(5, 3, 6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.3, 0);

// water: deep opaque blue + transparent turquoise surface at y=0 (rendered like the game's water)
const deep = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x1d4f6e, roughness: 0.9 }));
deep.rotation.x = -Math.PI / 2; deep.position.y = -1.6; deep.receiveShadow = true; scene.add(deep);
const surf = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshPhysicalMaterial({ color: 0x3fbfb5, transparent: true, opacity: 0.55, roughness: 0.08, metalness: 0, depthWrite: true }));
surf.rotation.x = -Math.PI / 2; surf.renderOrder = 2; surf.receiveShadow = true; scene.add(surf);

const $ = id => document.getElementById(id);
const net = createLandingNet();
// real seated angler if available; otherwise a stand-in with the same API (hip origin, faces +Z, hands by target)
let createAngler = null;
try { createAngler = (await import('../src/models/angler.js')).createAngler; } catch (err) { console.warn('angler.js not loadable', err); }
if (typeof createAngler !== 'function') {
  console.warn('createAngler unavailable: using stand-in mannequins');
  createAngler = (o = {}) => {
    const object = new THREE.Group(); const mat = new THREE.MeshStandardMaterial({ color: o.shirt ?? 0x888888, roughness: 0.8 });
    const skin = new THREE.MeshStandardMaterial({ color: o.skin ?? 0xe0b090, roughness: 0.6 }), pants = new THREE.MeshStandardMaterial({ color: 0x3d4038, roughness: 0.9 });
    const seg = (a, b, r, m) => { const g = new THREE.CylinderGeometry(r, r, 1, 10); g.translate(0, 0.5, 0); const me = new THREE.Mesh(g, m); me.castShadow = true; me.userData.ab = [a, b]; object.add(me); return me; };
    const place = (me, a, b) => { me.position.copy(a); me.scale.set(1, a.distanceTo(b), 1); me.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize()); };
    const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.15, 0.3, 4, 12), mat); torso.position.set(0, 0.28, -0.02); torso.castShadow = true; object.add(torso);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 12), skin); head.position.set(0, 0.66, 0); head.castShadow = true; object.add(head);
    for (const s of [1, -1]) { const H = new THREE.Vector3(s * 0.095, 0, 0.02), K = new THREE.Vector3(s * 0.12, 0.06, 0.455), A = new THREE.Vector3(s * 0.13, -0.37, 0.42);
      place(seg(H, K, 0.07, pants), H, K); place(seg(K, A, 0.055, pants), K, A); const boot = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.08, 0.27), pants); boot.position.set(A.x, A.y - 0.04, A.z + 0.07); object.add(boot); }
    const arms = { R: seg(new THREE.Vector3(), new THREE.Vector3(0, 1, 0), 0.04, mat), L: seg(new THREE.Vector3(), new THREE.Vector3(0, 1, 0), 0.04, mat) };
    const tgt = { R: null, L: null }; const inv = new THREE.Matrix4();
    return { object, head, setLook() {}, setFirstPerson() {}, setName() {},
      setHandTargets(r, l) { tgt.R = r ? r.clone() : null; tgt.L = l ? l.clone() : null; },
      update() { object.updateMatrixWorld(true); inv.copy(object.matrixWorld).invert();
        for (const [k, s] of [['R', -1], ['L', 1]]) { const sh = new THREE.Vector3(s * 0.172, 0.432, -0.03); const hand = tgt[k] ? tgt[k].clone().applyMatrix4(inv) : new THREE.Vector3(s * 0.14, 0.1, 0.34); place(arms[k], sh, hand); } } };
  };
}

// one rod prop per fishing angler (handle grips in the rod's frame)
function makeRod() {
  const rod = new THREE.Group();
  const blank = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.012, 2.2, 8), new THREE.MeshStandardMaterial({ color: 0x223322, roughness: 0.4 }));
  blank.rotation.x = Math.PI / 2; blank.position.z = 1.1; rod.add(blank);
  const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.45, 10), new THREE.MeshStandardMaterial({ color: 0x5a3b22, roughness: 0.8 }));
  grip.rotation.x = Math.PI / 2; grip.position.z = -0.1; rod.add(grip);
  const R = new THREE.Object3D(); rod.add(R); const L = new THREE.Object3D(); L.position.set(0, 0, -0.3); rod.add(L);
  return { rod, R, L };
}
const OUTFITS = [
  { shirt: 0x2f5f8a, vest: 0x7a5b3a, hat: 0x3d4a5c, skin: 0xd9a77f, name: 'Vreni' },
  { shirt: 0x8a2f2a, vest: 0x5b6b3a, hat: 0xc9b98f, name: 'Ueli' },
  { shirt: 0x4f7a3a, vest: 0x34424f, hat: 0xe0d6b8, name: 'Beat' },
  { shirt: 0x9a7a2a, vest: 0x5a3b52, hat: 0x2b2b2b, name: 'Heidi' },
  { shirt: 0x6a4a8a, vest: 0x3a5b5b, hat: 0xb08a5a, name: 'Ruedi' },
];

let boat = null, people = [], type = new URLSearchParams(location.search).get('type') || 'weidling';
function clearBoat() {
  if (!boat) return;
  scene.remove(boat.object);
  for (const p of people) { scene.remove(p.angler.object); if (p.rod) scene.remove(p.rod.rod); }
  people = [];
}
function build(t) {
  clearBoat(); type = t;
  const t0 = performance.now();
  boat = createBoat({ type, accent: parseInt($('accent').value.slice(1), 16) });
  window.__buildMs = performance.now() - t0;
  scene.add(boat.object);
  boat.object.add(net.object); net.object.position.copy(boat.netRest.position); net.object.quaternion.copy(boat.netRest.quaternion);
  applyPaint();
  // anglers live in world space (like the game): driver + fisher + every passenger seat
  const seats = [['driver', boat.seats.driver], ['fisher', boat.seats.fisher], ...boat.seats.passengers.map((p, i) => ['passenger' + i, p])];
  seats.forEach(([role, seat], i) => {
    const angler = createAngler(OUTFITS[i % OUTFITS.length]); scene.add(angler.object);
    const rod = role === 'driver' ? null : makeRod(); if (rod) scene.add(rod.rod);
    people.push({ role, seat, angler, rod, yawSide: i % 2 ? -1 : 1 });
  });
  document.querySelectorAll('.types button').forEach(b => b.classList.toggle('on', b.dataset.t === type));
  history.replaceState(null, '', '?type=' + type);
}
function applyPaint() { if (!boat) return; boat.setPaint($('paintOn').checked ? parseInt($('paint').value.slice(1), 16) : null); boat.setAccent(parseInt($('accent').value.slice(1), 16)); }
$('paint').oninput = $('paintOn').onchange = $('accent').oninput = applyPaint;
$('size').oninput = () => { $('sizev').textContent = (+$('size').value).toFixed(2) + '×'; };
document.querySelectorAll('.types button').forEach(b => b.onclick = () => build(b.dataset.t));

// UI
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyQ') $('anc').checked = !$('anc').checked; if (e.code === 'KeyC') $('chase').checked = !$('chase').checked; const v = '123456789'.indexOf(e.key); if (v >= 0) view(Object.keys(VIEWS)[v]); });
addEventListener('keyup', e => { keys[e.code] = false; });
// views in boat units (scaled by length and size)
const VIEWS = {
  overview: [[0.7, 0.42, 0.75], [0, 0.05, 0]],
  side: [[1.0, 0.16, 0.03], [0, 0.05, 0]],
  bow: [[0.18, 0.2, 0.68], [0, 0.12, 0.45]],
  stern: [[0.2, 0.12, -0.66], [0, 0.06, -0.5]],
  interior: [[0.01, 0.24, -0.5], [0, 0.0, 0.1]],
  top: [[0.001, 1.25, 0], [0, 0, 0]],
  anglers: [[0.3, 0.2, -0.1], [0, 0.08, -0.15]],
  under: [[0.35, -0.1, 0.25], [0, -0.03, 0]],
  helm: [[-0.06, 0.16, -0.22], [0, 0.08, 0.0]],
};
function view(n) {
  const v = VIEWS[n]; if (!v || !boat) return; $('chase').checked = false;
  const k = boat.length * (+$('size').value); const o = boat.object.position;
  camera.position.set(o.x + v[0][0] * k, o.y + v[0][1] * k, o.z + v[0][2] * k); controls.target.set(o.x + v[1][0] * k, o.y + v[1][1] * k, o.z + v[1][2] * k); controls.update();
}
document.querySelectorAll('.views button').forEach(b => b.onclick = () => view(b.dataset.v));

function boatOnlyStats() {
  let calls = 0, tris = 0;
  const skip = new Set([net.object]);
  const walk = (o) => { if (skip.has(o)) return; if (o.isMesh && o.visible) { calls++; const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3; } o.children.forEach(walk); };
  walk(boat.object);
  return { calls, tris: Math.round(tris) };
}
window.__stats = () => ({ type, buildMs: Math.round(window.__buildMs), boat: boatOnlyStats(), render: { calls: renderer.info.render.calls, tris: renderer.info.render.triangles } });
window.__build = build; window.__view = view; window.__scene = scene; window.__camera = camera; window.__controls = controls;
Object.defineProperty(window, '__boat', { get: () => boat });
// reliable screenshots from background tabs: render now and show the frame as a full-screen <img>
window.__shot = (on = true) => { tick(0.033); const img = $('shot'); if (on) { img.src = renderer.domElement.toDataURL('image/jpeg', 0.92); img.style.display = 'block'; $('ui').style.display = 'none'; } else { img.style.display = 'none'; $('ui').style.display = ''; } return true; };

const clock = new THREE.Clock();
const tmpR = new THREE.Vector3(), tmpL = new THREE.Vector3(), q = new THREE.Quaternion(), e = new THREE.Euler();
let frame = 0, chaseYaw = 0;
function tick(forceDt) {
  const dt = forceDt ?? Math.min(0.05, clock.getDelta()); const t = clock.elapsedTime;
  if (!boat) return;
  if (keys.KeyW) $('thr').value = Math.min(1, +$('thr').value + dt);
  if (keys.KeyS) $('thr').value = Math.max(-1, +$('thr').value - dt);
  if (keys.KeyA) $('str').value = Math.max(-1, +$('str').value - dt * 2);
  if (keys.KeyD) $('str').value = Math.min(1, +$('str').value + dt * 2);
  boat.setThrottle(+$('thr').value); boat.setSteer(+$('str').value); boat.setAnchor($('anc').checked);
  const size = +$('size').value; boat.object.scale.setScalar(size);
  if ($('bob').checked) { boat.object.position.y = Math.sin(t * 1.3) * 0.03; boat.object.rotation.z = Math.sin(t * 0.9) * 0.03; boat.object.rotation.x = Math.sin(t * 0.7) * 0.012; }
  else { boat.object.position.y = 0; boat.object.rotation.set(0, 0, 0); }
  boat.update(dt, t);
  boat.object.updateMatrixWorld(true);
  boat.object.getWorldQuaternion(q);
  const show = $('ang').checked;
  for (const p of people) {
    const a = p.angler; a.object.visible = show; if (p.rod) p.rod.rod.visible = show; if (!show) continue;
    // world-space placement from the boat-local hip position (anglers are not scaled with the boat)
    a.object.position.copy(p.seat).applyMatrix4(boat.object.matrixWorld); a.object.quaternion.copy(q);
    a.object.updateMatrixWorld(true);
    if (p.role === 'driver') {
      a.setLook(0.15, -0.1);
      a.setHandTargets(boat.helm.right.getWorldPosition(tmpR), boat.helm.left ? boat.helm.left.getWorldPosition(tmpL) : null);
    } else {
      const yaw = p.role === 'fisher' ? +$('lyaw').value : 0.9 * p.yawSide;
      a.setLook(yaw, -0.15);
      // rod held out to the side the angler looks at
      const r = p.rod.rod; r.position.set(0.05 - 0.1 * Math.sign(yaw), 0.28, 0.25).applyQuaternion(q).add(a.object.position);
      e.set(-0.45, yaw * 0.85, 0, 'YXZ'); r.quaternion.copy(q).multiply(new THREE.Quaternion().setFromEuler(e)); r.updateMatrixWorld(true);
      a.setHandTargets(p.rod.R.getWorldPosition(tmpR), p.rod.L.getWorldPosition(tmpL));
    }
    a.update(dt);
  }
  if ($('chase').checked) {
    // game-like chase camera: behind and above the stern, looking forward
    const k = boat.length * size; const back = new THREE.Vector3(0, 0.36 * k + 1.2, -0.95 * k - 2).applyQuaternion(q).add(boat.object.position);
    camera.position.lerp(back, forceDt ? 1 : Math.min(1, dt * 4)); controls.target.copy(boat.object.position).add(new THREE.Vector3(0, 1.0, 0.2 * k).applyQuaternion(q));
  }
  controls.update();
  renderer.render(scene, camera);
  if ((frame++ & 31) === 0) { const s = window.__stats(); $('stats').textContent = `${type}: ${s.boat.calls} draw calls, ${s.boat.tris} tris\nbuild ${s.buildMs} ms\nframe: ${s.render.calls} calls, ${s.render.tris} tris`; }
}
renderer.setAnimationLoop(() => tick());
window.__tick = (n = 1) => { for (let i = 0; i < n; i++) tick(0.033); return true; };
build(type);
view('overview');
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
