<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Angler preview</title>
<style>
html,body{margin:0;height:100%;background:#8fb3d9;overflow:hidden;font:12px/1.4 system-ui,sans-serif}
canvas{display:block}
#ui{position:fixed;left:10px;top:10px;bottom:10px;width:300px;overflow-y:auto;overflow-x:hidden;background:rgba(15,25,30,.78);color:#e8f1f2;padding:10px 12px;border-radius:8px;box-sizing:border-box}
#ui h3{margin:10px 0 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#9fd6cf}
#ui .row{margin:6px 0}
#ui .lab{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
#ui .lab span{color:#b9c9cb}
#ui button{font-size:11px;margin:2px 2px 0 0;padding:3px 6px;border-radius:4px;border:1px solid #4b6066;background:#22343a;color:#e8f1f2;cursor:pointer}
#ui button.on{background:#3f7f74;border-color:#7cc7b8}
#ui .sw{width:20px;height:20px;padding:0;border-radius:50%;border:2px solid transparent;margin:2px 3px 0 0}
#ui .sw.on{border-color:#fff}
#ui .row.dis{opacity:.4}
#ui input[type=color]{width:26px;height:20px;border:0;padding:0;background:none;vertical-align:middle}
#ui select,#ui input[type=text]{width:100%;background:#22343a;color:#e8f1f2;border:1px solid #4b6066;border-radius:4px;padding:3px}
#ui label.chk{display:flex;justify-content:space-between;align-items:center;margin:4px 0}
#stats{margin-top:8px;color:#9fd6cf;white-space:pre;font:11px/1.35 ui-monospace,monospace}
#shot{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:none;z-index:10}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <b>Angler preview</b>
  <div class="row"><div class="lab"><span>Edit angler</span></div><select id="target"></select></div>
  <div class="row"><div class="lab"><span>Name tag</span></div><input id="name" type="text"></div>
  <div id="opts"></div>
  <h3>Pose / view</h3>
  <div class="row"><button id="rand">Random outfit</button><button id="reset">Reset outfit</button></div>
  <label class="chk">First person (hides head + shells) <input id="fp" type="checkbox"></label>
  <label class="chk">Walk amount <input id="walk" type="range" min="0" max="1" step="0.01" value="1"></label>
  <label class="chk">Animate look <input id="lookAnim" type="checkbox" checked></label>
  <div class="row views">Views:
    <button data-v="overview">overview</button><button data-v="face">face</button><button data-v="face3q">face ¾</button><button data-v="side">profile</button>
    <button data-v="hands">hands</button><button data-v="boots">boots</button><button data-v="back">back</button><button data-v="full">full body</button>
  </div>
  <div id="stats"></div>
</div>
<img id="shot" alt="">
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { createAngler, ANGLER_OPTIONS, STAND_HIP_HEIGHT } from '../src/models/angler.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fb3d9);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;
const sun = new THREE.DirectionalLight(0xfff1dd, 3); sun.position.set(5, 8, 4); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 0.5, far: 30 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x5a4a30, 0.6));
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 500);
const controls = new OrbitControls(camera, renderer.domElement);
const clock = new THREE.Clock();

const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0x6f7d55, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// bench for the seated angler (seat surface 0.352 so the boots touch the ground)
const bench = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.352, 0.4), new THREE.MeshStandardMaterial({ color: 0x7a5a3a, roughness: 0.8 }));
bench.position.set(1.3, 0.176, -0.05); bench.castShadow = bench.receiveShadow = true; scene.add(bench);
const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.012, 2.4, 8), new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.4 }));
rod.castShadow = true; scene.add(rod);

// ---- the cast
const people = [];
function add(name, x, mode, outfit = {}) {
  const a = createAngler({ name, ...outfit });
  const p = { name, a, mode, x, defaults: a.getOutfit() };
  a.object.position.set(x, mode === 'seat' ? 0.452 : STAND_HIP_HEIGHT, mode === 'seat' ? 0.0 : 0.6);
  scene.add(a.object); a.setStance(mode === 'seat' ? 'sit' : 'stand'); people.push(p); return p;
}
add('You (walking)', 0, 'walk');
add('Hans (seated)', 1.3, 'seat', { beard: 'short', hatStyle: 'cap', hat: 0x5b6b3a, glasses: 'none', vest: 0x7a5b3a });
add('Ueli', -1.2, 'idle');
add('Vreni', -2.3, 'idle', { hairStyle: 'ponytail', beard: 'none', hatStyle: 'cap', hat: 0x2f4f7a, glasses: 'none', vestStyle: 'jacket', vest: 0xa3542a, shirt: 0x2f5f8a, pants: 0x4a5d78, boots: 0x1c1d1f, skin: 0xefc4a4, hair: 0x9a4a26 });
add('Sepp', 2.5, 'idle', { hairStyle: 'short', beard: 'full', hatStyle: 'beanie', hat: 0xd9772b, glasses: 'round', vestStyle: 'none', shirt: 0x3f5a35, pants: 0x7d6f52, boots: 0x5a3a24, skin: 0xc58b66, hair: 0x8a7d70 });
add('Kofi', 3.6, 'idle', { hairStyle: 'bald', beard: 'stubble', hatStyle: 'straw', hat: 0xe2d3a6, glasses: 'none', vestStyle: 'vest', vest: 0x8a7a55, shirt: 0x5d6b73, pants: 0x55603f, boots: 0x283326, skin: 0x6e4430, hair: 0x1c1714 });
add('Lena', -3.4, 'idle', { hairStyle: 'long', beard: 'none', hatStyle: 'none', glasses: 'round', vestStyle: 'jacket', vest: 0x2b3a52, shirt: 0x8a2f2a, pants: 0x2d3a4f, boots: 0xc9a227, skin: 0xd9a47c, hair: 0xc9a66b });
window.people = people;

// ---- outfit editor (generated from ANGLER_OPTIONS)
const $ = (id) => document.getElementById(id);
const css = (v) => '#' + v.toString(16).padStart(6, '0');
let cur = people[0];
people.forEach((p, i) => $('target').add(new Option(p.name, i)));
$('target').onchange = () => { cur = people[+$('target').value]; $('fp').checked = false; people.forEach(p => p.a.setFirstPerson(false)); refresh(); setView(lastView); };
let group = '';
for (const o of ANGLER_OPTIONS) {
  if (o.group !== group) { group = o.group; $('opts').insertAdjacentHTML('beforeend', `<h3>${group}</h3>`); }
  const row = document.createElement('div'); row.className = 'row'; row.dataset.id = o.id;
  row.innerHTML = `<div class="lab"><span>${o.label}</span>${o.type === 'color' ? '<input type="color">' : ''}</div><div class="vals"></div>`;
  const vals = row.querySelector('.vals');
  if (o.type === 'choice') for (const c of o.choices) { const b = document.createElement('button'); b.textContent = c.label; b.dataset.v = c.value; b.onclick = () => apply(o.id, c.value); vals.appendChild(b); }
  else {
    for (const c of o.swatches) { const b = document.createElement('button'); b.className = 'sw'; b.title = c.label; b.style.background = css(c.value); b.dataset.v = c.value; b.onclick = () => apply(o.id, c.value); vals.appendChild(b); }
    row.querySelector('input').oninput = (e) => apply(o.id, e.target.value);
  }
  $('opts').appendChild(row);
}
function apply(id, v) { const t0 = performance.now(); cur.a.setOutfit({ [id]: v }); lastBuildMs = performance.now() - t0; refresh(); }
let lastBuildMs = 0;
function refresh() {
  const of = cur.a.getOutfit();
  for (const row of $('opts').children) {
    const id = row.dataset.id; if (!id) continue; const o = ANGLER_OPTIONS.find(d => d.id === id);
    for (const b of row.querySelectorAll('.vals button')) b.classList.toggle('on', String(of[id]) === b.dataset.v);
    const inp = row.querySelector('input[type=color]'); if (inp) inp.value = css(of[id]);
    const dis = o.disabledWhen && Object.entries(o.disabledWhen).some(([k, list]) => list.includes(of[k])); row.classList.toggle('dis', !!dis);
  }
  $('name').value = cur.tagName ?? cur.name;
  stats();
}
$('name').oninput = (e) => { cur.tagName = e.target.value; cur.a.setName(e.target.value); };
$('fp').onchange = (e) => cur.a.setFirstPerson(e.target.checked);
$('rand').onclick = () => {
  const pick = (l) => l[Math.floor(Math.random() * l.length)];
  const o = {}; for (const d of ANGLER_OPTIONS) o[d.id] = d.type === 'choice' ? pick(d.choices).value : pick(d.swatches).value;
  cur.a.setOutfit(o); refresh();
};
$('reset').onclick = () => { cur.a.setOutfit(cur.defaults); refresh(); };

function anglerStats(a) {
  let tris = 0, meshes = 0;
  a.object.traverse(m => { if (m.isSkinnedMesh) { meshes++; tris += m.geometry.index.count / 3; } });
  return { tris, meshes, calls: meshes + 1 };
}
function stats() {
  const s = anglerStats(cur.a);
  const all = people.map(p => `${p.name.padEnd(14)} ${String(anglerStats(p.a).tris).padStart(6)} tris  ${anglerStats(p.a).calls} calls`).join('\n');
  $('stats').textContent = `selected: ${s.tris} tris, ${s.meshes} meshes + tag = ${s.calls} draw calls\nlast setOutfit: ${lastBuildMs.toFixed(1)} ms\nrenderer: ${renderer.info.render.calls} calls, ${renderer.info.render.triangles} tris\n\n${all}`;
}
window.anglerStats = () => people.map(p => ({ name: p.name, ...anglerStats(p.a), outfit: p.a.getOutfit() }));
window.renderer = renderer; // for inspecting renderer.info.memory after outfit swaps

// ---- views (relative to the selected angler)
let lastView = 'overview';
const W = (p, x, y, z) => p.a.object.localToWorld(new THREE.Vector3(x, y, z));
function setView(v) {
  lastView = v; const p = cur, seat = p.mode === 'seat';
  const head = p.a.head.getWorldPosition(new THREE.Vector3());
  const V = {
    overview: [new THREE.Vector3(0.2, 1.7, 6.2), new THREE.Vector3(0.1, 0.85, 0)],
    full: [W(p, 0.9, 0.2, 2.6), W(p, 0, seat ? 0.05 : -0.1, 0)],
    face: [head.clone().add(new THREE.Vector3(0, 0.01, 0.42)), head.clone().add(new THREE.Vector3(0, -0.02, 0))],
    face3q: [head.clone().add(new THREE.Vector3(0.3, 0.04, 0.32)), head.clone().add(new THREE.Vector3(0, -0.02, 0))],
    side: [head.clone().add(new THREE.Vector3(0.45, 0.0, 0.02)), head.clone().add(new THREE.Vector3(0, -0.02, 0))],
    hands: seat ? [W(p, 0.25, 0.35, 0.95), W(p, 0, 0.12, 0.38)] : [W(p, 0.5, 0.0, 0.55), W(p, 0, -0.12, 0.1)],
    boots: seat ? [W(p, 0.45, -0.2, 1.1), W(p, 0, -0.42, 0.45)] : [W(p, 0.55, -0.6, 0.75), W(p, 0, -0.85, 0.05)],
    back: [W(p, 0.4, 0.8, -1.4), W(p, 0, 0.45, 0)],
  }[v];
  camera.position.copy(V[0]); controls.target.copy(V[1]); controls.update();
  document.querySelectorAll('.views button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
}
document.querySelectorAll('.views button').forEach(b => b.onclick = () => setView(b.dataset.v));
window.setView = setView;
window.select = (i) => { $('target').value = i; $('target').onchange(); };

// ---- animation
let walkPhase = 0, t = 0;
const _r = new THREE.Vector3(), _l = new THREE.Vector3();
function step(dt) {
  t += dt;
  const amt = +$('walk').value, anim = $('lookAnim').checked;
  for (const p of people) {
    const a = p.a, o = a.object;
    if (p.mode === 'seat') {
      const yaw = anim ? Math.sin(t * 0.35) * 0.9 : 0;
      a.setLook(yaw, anim ? -0.15 + Math.sin(t * 0.5) * 0.15 : 0);
      // rod in both hands, pointing forward-up
      const base = W(p, -0.05, 0.1, 0.28), dir = new THREE.Vector3(0.25, 0.42, 1).normalize().transformDirection(o.matrixWorld);
      a.setHandTargets(base.clone().addScaledVector(dir, 0.06), base.clone().addScaledVector(dir, 0.36));
      rod.position.copy(base).addScaledVector(dir, 1.1); rod.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    } else {
      const walk = p.mode === 'walk' ? amt : 0;
      if (p.mode === 'walk') walkPhase += dt * 7.5 * (0.4 + 0.6 * walk);
      const ph = p.mode === 'walk' ? walkPhase : 0;
      o.position.y = STAND_HIP_HEIGHT + Math.abs(Math.sin(ph)) * 0.03 * walk;
      o.updateMatrixWorld(true);
      a.setWalk(ph, walk);
      a.setLook(anim && p.mode === 'idle' ? Math.sin(t * 0.4 + p.x) * 0.5 : 0, 0);
      const sw = Math.sin(ph) * 0.2 * walk;
      a.setHandTargets(_r.set(-0.21, -0.14, 0.08 - sw).applyMatrix4(o.matrixWorld), _l.set(0.21, -0.14, 0.08 + sw).applyMatrix4(o.matrixWorld));
    }
    a.update(dt);
  }
}
// render once into an <img> (reliable screenshots from background tabs)
window.snap = (v) => { if (v) setView(v); step(0); renderer.render(scene, camera); const img = $('shot'); img.src = renderer.domElement.toDataURL('image/png'); img.style.display = 'block'; stats(); return renderer.info.render; };
window.unsnap = () => { $('shot').style.display = 'none'; };
$('shot').onclick = window.unsnap;

// let the stance blends settle, then show
for (let i = 0; i < 40; i++) step(1 / 30);
setView('overview'); refresh();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  step(dt);
  controls.update();
  renderer.render(scene, camera);
  if ((t * 4 | 0) !== ((t - dt) * 4 | 0)) stats();
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
console.log('angler preview ready', window.anglerStats().map(s => `${s.name}: ${s.tris} tris / ${s.calls} calls`).join(' | '));
</script>
</body>
</html>
